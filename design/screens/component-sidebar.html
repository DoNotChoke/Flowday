<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Sidebar</title>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 100%; box-sizing: border-box; font-family: Poppins, sans-serif; color: #151515; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 24px; box-shadow: 0 5px 0 #151515; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
  <a href="Board.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #151515; padding: 0 6px">
    <span style="width: 38px; height: 38px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFC94A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </span>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px">Flowday</span>
  </a>

  <a href="CreateTask.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F47258; border: 1.5px solid #151515; border-radius: 14px; box-shadow: 0 4px 0 #151515; text-decoration: none; color: #151515; font-size: 15px; font-weight: 600">
    <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    New task
  </a>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #5F5F5F; padding: 0 10px 6px">WORKSPACE</span>
    <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
      <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
        <a href="{{item.href}}" aria-current="page" style="height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; background: #FFF3D1; border: 1.5px solid #151515; text-decoration: none; color: #151515; font-size: 14px; font-weight: 600">
          <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <span style="font-size: 12px; font-weight: 600">{{item.badge}}</span>
        </a>
      </sc-if>
      <sc-if value="{{item.idle}}" hint-placeholder-val="{{true}}">
        <a href="{{item.href}}" style="height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; border: 1.5px solid transparent; text-decoration: none; color: #3D3D3D; font-size: 14px; font-weight: 500">
          <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <span style="font-size: 12px; color: #5F5F5F">{{item.badge}}</span>
        </a>
      </sc-if>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px 10px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #5F5F5F">PROJECTS</span>
      <a href="CreateProject.dc.html" aria-label="New project" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #151515; border-radius: 8px">
        <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>
    <a href="Project.dc.html" style="height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; color: #3D3D3D; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F47258; border: 1px solid #151515"></span><span style="flex: 1">Flowday app</span><span style="font-size: 12px; color: #5F5F5F">18</span></a>
    <a href="Project.dc.html" style="height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; color: #3D3D3D; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5B8DEF; border: 1px solid #151515"></span><span style="flex: 1">Thesis — Agent Memory</span><span style="font-size: 12px; color: #5F5F5F">9</span></a>
    <a href="Project.dc.html" style="height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; color: #3D3D3D; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #4FC1BE; border: 1px solid #151515"></span><span style="flex: 1">Personal</span><span style="font-size: 12px; color: #5F5F5F">5</span></a>
  </div>

  <a href="History.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FDE3DD; border: 1.5px solid #151515; text-decoration: none; color: #151515">
    <svg width="30" height="30" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 7.5-3 7.5-7.2 0-3.4-2-5.6-3.6-7.6-.4 1.6-1.3 2.7-2.4 3.2.3-3.4-1.2-6.5-4.5-8.4.3 3.1-1.4 5-3 6.9C4.6 10.8 4.5 12.6 4.5 14.8 4.5 19 7.6 22 12 22z" fill="#F47258" stroke="#151515" stroke-width="1.5" stroke-linejoin="round"></path><path d="M12 22c-2 0-3.3-1.4-3.3-3.3 0-1.8 1.4-3 2.4-4.2.3 1 .9 1.6 1.7 1.8 0-1.2.6-2.3 1.4-3 .5 1.6 2.1 2.8 2.1 5.2 0 2-1.6 3.5-4.3 3.5z" fill="#FFC94A"></path></svg>
    <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">12 days</span><span style="font-size: 12px; color: #4A2A22">Current streak</span></span>
  </a>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 6px 0; border-top: 1.5px dashed #CFCFCB">
    <span style="width: 38px; height: 38px; border-radius: 50%; background: #5B8DEF; border: 1.5px solid #151515; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">N</span>
    <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600">Nghia</span><span style="font-size: 12px; color: #5F5F5F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">nghia@gmail.com</span></span>
    <a href="Main.dc.html" aria-label="Sign out" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tasks&quot;,&quot;calendar&quot;,&quot;history&quot;,&quot;focus&quot;,&quot;settings&quot;,&quot;project&quot;],&quot;default&quot;:&quot;tasks&quot;},&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:880}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'tasks';
    const list = [
      { key: 'tasks', label: 'My tasks', href: 'Board.dc.html', badge: '24', d: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11' },
      { key: 'calendar', label: 'Calendar', href: 'Calendar.dc.html', badge: '', d: 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' },
      { key: 'history', label: 'History', href: 'History.dc.html', badge: '', d: 'M3 3v18h18M8 17v-5M13 17V8M18 17v-9' },
      { key: 'focus', label: 'Focus mode', href: 'Focus.dc.html', badge: '', d: 'M12 9v4l2.5 2M9 2h6M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z' },
      { key: 'settings', label: 'Settings', href: '#', badge: '', d: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6' }
    ];
    return { items: list.map((i) => ({ ...i, active: i.key === active, idle: i.key !== active })) };
  }
}
</script>


</body></html>
