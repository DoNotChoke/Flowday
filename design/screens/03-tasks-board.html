<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Flowday — Tasks board</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#151515}a:hover{color:#C2412A}
input::placeholder{color:#7A7A7A}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F3F3F1; font-family: Poppins, sans-serif; color: #151515; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
  <div style="flex: 1 1 240px; min-width: 0; max-width: 100%">
    <dc-import name="Sidebar" active="tasks" hint-size="100%,860px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
    <!-- Header -->
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Hi, Nghia</h1>
        <p style="margin: 0; font-size: 14px; color: #5F5F5F">Sunday, 1 November · 6 tasks due today</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <label style="height: 46px; min-width: 260px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 14px">
          <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5F5F5F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" aria-label="Search tasks" placeholder="Search tasks…" style="flex: 1; border: 0; outline: 0; background: transparent; font-family: Poppins, sans-serif; font-size: 14px">
          <span style="font-size: 11px; color: #5F5F5F; border: 1px solid #CFCFCB; border-radius: 6px; padding: 2px 6px">⌘K</span>
        </label>
        <a href="History.dc.html" style="height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #FDE3DD; border: 1.5px solid #151515; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 14px">
          <svg width="20" height="20" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 7.5-3 7.5-7.2 0-3.4-2-5.6-3.6-7.6-.4 1.6-1.3 2.7-2.4 3.2.3-3.4-1.2-6.5-4.5-8.4.3 3.1-1.4 5-3 6.9C4.6 10.8 4.5 12.6 4.5 14.8 4.5 19 7.6 22 12 22z" fill="#F47258" stroke="#151515" stroke-width="1.5" stroke-linejoin="round"></path></svg>
          12
        </a>
        <button type="button" aria-label="Notifications" style="position: relative; width: 46px; height: 46px; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
          <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #F47258; border: 1.5px solid #FFFFFF"></span>
        </button>
      </div>
    </header>

    <!-- Status summary -->
    <section aria-label="Task status" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: {{s.bg}}; border: 1.5px solid #151515; border-radius: 20px; box-shadow: 0 5px 0 #151515; padding: 18px; display: flex; align-items: center; gap: 14px">
          <span style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 1.5px solid rgba(21,21,21,0.25); display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
            <span style="font-size: 13px">{{s.count}} Tasks</span>
          </span>
          <span style="font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.55); border-radius: 999px; padding: 4px 10px">{{s.delta}}</span>
        </div>
      </sc-for>
    </section>

    <!-- Toolbar -->
    <section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="Filter by category">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
            <button type="button" sc-camel-on-click="{{c.pick}}" aria-pressed="true" style="height: 38px; padding: 0 16px; background: #151515; color: #FFFFFF; border: 1.5px solid #151515; border-radius: 999px; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">{{c.label}}</button>
          </sc-if>
          <sc-if value="{{c.off}}" hint-placeholder-val="{{true}}">
            <button type="button" sc-camel-on-click="{{c.pick}}" aria-pressed="false" style="height: 38px; padding: 0 16px; background: #FFFFFF; color: #151515; border: 1.5px solid #151515; border-radius: 999px; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">{{c.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <div role="group" aria-label="View" style="display: flex; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 12px; padding: 3px">
          <button type="button" style="height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: #FFF3D1; border: 0; border-radius: 9px; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">
            <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1.5"></rect><rect x="14" y="3" width="7" height="11" rx="1.5"></rect></svg>Board</button>
          <button type="button" style="height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 9px; font-family: Poppins, sans-serif; font-size: 13px; cursor: pointer">
            <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
        </div>
        <button type="button" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 12px; font-family: Poppins, sans-serif; font-size: 13px; cursor: pointer">
          <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"></path></svg>Sort: Priority</button>
      </div>
    </section>

    <!-- Kanban -->
    <section aria-label="Board" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: start">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
        <div style="background: #E9E9E5; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px">
            <span style="width: 12px; height: 12px; border-radius: 4px; background: {{col.color}}; border: 1.5px solid #151515"></span>
            <h2 style="margin: 0; flex: 1; font-size: 15px; font-weight: 600">{{col.name}}</h2>
            <span style="font-size: 12px; font-weight: 600; background: #FFFFFF; border: 1px solid #151515; border-radius: 999px; padding: 1px 9px">{{col.count}}</span>
            <a href="CreateTask.dc.html" aria-label="Add task" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 9px">
              <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </a>
          </div>

          <sc-for list="{{col.tasks}}" as="t" hint-placeholder-count="3">
            <a href="TaskDetail.dc.html" style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1.5px solid #151515; border-radius: 18px; box-shadow: 0 4px 0 #151515; padding: 16px; text-decoration: none; color: #151515; opacity: {{t.opacity}}">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-size: 11px; font-weight: 500; background: #F0F0EC; border-radius: 999px; padding: 4px 10px">{{t.cat}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; background: {{t.pBg}}; border-radius: 999px; padding: 4px 10px">
                  <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.pDot}}"></span>{{t.priority}}
                </span>
              </div>
              <div style="display: flex; gap: 12px; align-items: center">
                <div style="flex: 1; min-width: 0">
                  <div style="font-size: 15px; font-weight: 600; line-height: 1.35; text-decoration: {{t.strike}}">{{t.title}}</div>
                  <div style="font-size: 12px; color: #5F5F5F; margin-top: 2px">{{t.project}}</div>
                </div>
                <span style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: conic-gradient({{t.ring}} 0 {{t.pct}}%, #ECECE8 0); display: flex; align-items: center; justify-content: center">
                  <span style="width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">{{t.pct}}%</span>
                </span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px dashed #D6D6D1; font-size: 12px; color: #3D3D3D">
                <span style="display: flex; align-items: center; gap: 6px">
                  <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>{{t.sub}}
                </span>
                <span style="display: flex; align-items: center; gap: 6px; font-weight: {{t.dueWeight}}; color: {{t.dueColor}}">
                  <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{t.due}}
                </span>
              </div>
            </a>
          </sc-for>
          <sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}">
            <div style="border: 1.5px dashed #9C9C96; border-radius: 16px; padding: 20px; text-align: center; font-size: 13px; color: #5F5F5F">No tasks in this category</div>
          </sc-if>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1180}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All' }; }
  renderVals() {
    const P = {
      Urgent: { pBg: '#FDE3DD', pDot: '#E0492C' },
      High: { pBg: '#FFF3D1', pDot: '#D99A00' },
      Medium: { pBg: '#E3ECFD', pDot: '#3A6FD8' },
      Low: { pBg: '#EEEEEA', pDot: '#7A7A7A' }
    };
    const raw = [
      { key: 'ongoing', name: 'On going', color: '#5B8DEF', tasks: [
        { title: 'Website for Rune.io', project: 'Digital Product Design', cat: 'Design', priority: 'High', pct: 40, sub: '5/12', due: 'Nov 6' },
        { title: 'Thesis ch.3 — Retrieval module', project: 'Thesis — Agent Memory', cat: 'Research', priority: 'Urgent', pct: 25, sub: '2/8', due: 'Nov 5' },
        { title: 'Set up CI pipeline', project: 'Flowday app', cat: 'Development', priority: 'Medium', pct: 60, sub: '3/5', due: 'Nov 9' }
      ]},
      { key: 'process', name: 'In process', color: '#FFC94A', tasks: [
        { title: 'Dashboard for ProSavvy', project: 'Digital Product Design', cat: 'Design', priority: 'High', pct: 75, sub: '9/12', due: 'Today', today: true },
        { title: 'Google OAuth sign-in', project: 'Flowday app', cat: 'Development', priority: 'Urgent', pct: 50, sub: '4/8', due: 'Today', today: true },
        { title: 'Weekly sync notes', project: 'Work', cat: 'Meeting', priority: 'Low', pct: 80, sub: '4/5', due: 'Nov 2' }
      ]},
      { key: 'done', name: 'Completed', color: '#4FC1BE', tasks: [
        { title: 'Mobile app for Track.id', project: 'Digital Product Design', cat: 'Development', priority: 'Medium', pct: 100, sub: '12/12', due: 'Oct 30' },
        { title: 'Literature review', project: 'Thesis — Agent Memory', cat: 'Research', priority: 'High', pct: 100, sub: '6/6', due: 'Oct 28' }
      ]},
      { key: 'cancel', name: 'Canceled', color: '#F47258', tasks: [
        { title: 'Website for CourierGo.com', project: 'Digital Product Design', cat: 'Design', priority: 'Low', pct: 40, sub: '5/12', due: 'Oct 20', canceled: true }
      ]}
    ];
    const cat = this.state.cat;
    const columns = raw.map((c) => {
      const tasks = c.tasks.filter((t) => cat === 'All' || t.cat === cat).map((t) => ({
        ...t, ...P[t.priority],
        ring: t.canceled ? '#B5B5B0' : c.color,
        opacity: t.canceled ? 0.7 : 1,
        strike: t.canceled ? 'line-through' : 'none',
        dueColor: t.today ? '#C2412A' : '#3D3D3D',
        dueWeight: t.today ? 600 : 400
      }));
      return { ...c, tasks, count: tasks.length, empty: tasks.length === 0 };
    });
    const catList = ['All', 'Design', 'Development', 'Research', 'Meeting', 'Personal'];
    return {
      columns,
      cats: catList.map((l) => ({ label: l, on: l === cat, off: l !== cat, pick: () => this.setState({ cat: l }) })),
      stats: [
        { name: 'On going', count: 24, bg: '#5B8DEF', delta: '+3', d: 'M21 12a9 9 0 0 1-15.5 6.3M3 12a9 9 0 0 1 15.5-6.3M21 4v5h-5M3 20v-5h5' },
        { name: 'In process', count: 12, bg: '#FFC94A', delta: '6 today', d: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' },
        { name: 'Completed', count: 42, bg: '#4FC1BE', delta: '+8 wk', d: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M9 15l2 2 4-4' },
        { name: 'Canceled', count: 8, bg: '#F47258', delta: '−2', d: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M10 13l4 4M14 13l-4 4' }
      ]
    };
  }
}
</script>


</body></html>
