name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://flowday:flowday@localhost:5432/flowday
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: owner@flowday.test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowday
          POSTGRES_PASSWORD: flowday
          POSTGRES_DB: flowday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
